plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'xyz.cirno.avbsign'
    compileSdk 36

    defaultConfig {
        applicationId "xyz.cirno.avbsign"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        aidl true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            useJUnit()
            systemProperty 'test.resourcesDir', file('src/main/res').absolutePath
        }
    }

    packagingOptions {
        resources {
            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
            excludes += "META-INF/services/java.security.Provider"
            excludes += "org/bouncycastle/**"
        }
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("avbsign-${variant.name}.apk")
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.preference
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.material

    // compileOnly libs.annotations
    compileOnly project(':hidden-api')
    implementation project(':avb')
    implementation project(':entry')
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}